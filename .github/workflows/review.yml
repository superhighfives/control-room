name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          Runner label. Use macos-latest for anything needing Xcode.
        type: string
        required: false
        default: ubuntu-latest
      runtime:
        description: >-
          Which runtime to set up before setup_command — "node", "bun", or
          "none" when the toolchain is already on the runner. Ignored when
          setup_command is empty.
        type: string
        required: false
        default: node
      node_version:
        description: Node version, when runtime is "node".
        type: string
        required: false
        default: '22'
      setup_command:
        description: >-
          Command that installs dependencies, so the reviewer can actually run
          your typechecker and linter instead of reasoning about them from
          source. Empty skips install entirely.
        type: string
        required: false
        default: ''
      verify_commands:
        description: >-
          Commands the reviewer should run against the branch, one per line.
          Only useful alongside setup_command.
        type: string
        required: false
        default: ''
      standards_ref:
        description: Ref of superhighfives/control-room to pin the review standard to.
        type: string
        required: false
        default: main
      timeout_minutes:
        description: Fail loudly rather than hanging to GitHub's 6h default.
        type: number
        required: false
        default: 20
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Newest push to a PR wins; cancel stale review runs instead of piling up.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the reviewer can read git blame for context.
          fetch-depth: 0

      - name: Checkout review standard
        uses: actions/checkout@v7
        with:
          repository: superhighfives/control-room
          ref: ${{ inputs.standards_ref }}
          path: .claude-review

      - name: Set up Node
        if: inputs.setup_command != '' && inputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Set up Bun
        if: inputs.setup_command != '' && inputs.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: inputs.setup_command != ''
        run: |
          if [ "${{ inputs.runtime }}" = "node" ]; then corepack enable; fi
          ${{ inputs.setup_command }}

      - name: Mark review start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dependabot and repo automation (e.g. update-color-names.yml) open
          # PRs as bot actors, which the action gates off by default ("Workflow
          # initiated by non-human actor"). Allowlist both so their PRs get the
          # same review as human ones. Still scoped — other bots stay gated.
          allowed_bots: dependabot[bot],github-actions[bot]
          additional_permissions: |
            actions: read
          # Without this the job is a black box: Claude runs for minutes,
          # produces nothing visible, and a failure to post looks identical
          # to a clean review.
          show_full_output: true
          # Agent mode grants no tools by default, so the review had no way to
          # run gh, git blame, or the verify commands. Bash is broad, but fork
          # PRs don't receive secrets and the token is read-mostly.
          #
          # Monitor is needed for slow verify commands: a build that outlives
          # the agent's 300s per-Bash timeout is pushed to the background, and
          # the agent uses Monitor to wait for it to finish. Without Monitor
          # allowed, that wait is denied in the headless run and the agent
          # abandons the review mid-build — a green check with no review posted.
          claude_args: |
            --allowedTools Bash,Read,Grep,Glob,Monitor
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in
            ${{ github.repository }}, then submit it as a single POST to the
            reviews API so the summary and the inline comments land atomically.
            Write the JSON payload to `$RUNNER_TEMP/review.json` (a later step
            falls back to that exact file if your POST doesn't land), then send it:

              gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input "$RUNNER_TEMP/review.json"

            The payload looks like:

              {
                "event": "REQUEST_CHANGES",
                "body": "<!-- control-room:review -->\n## 🔴 Changes requested\n...summary, verdict table, per-category rollups...",
                "comments": [
                  { "path": "src/db.ts", "line": 42, "side": "RIGHT",
                    "body": "⛔ **[BLOCKING]** request `id` is concatenated into SQL..." }
                ]
              }

            Rules for the payload:

            - `event` comes from your overall verdict (see REVIEW.md's Verdicts
              table): 🔴 → `REQUEST_CHANGES`, 🟡 → `COMMENT`, 🟢 → `APPROVE`.
            - `body` MUST begin with the exact line `<!-- control-room:review -->`
              so later rounds can find it, followed by the overall verdict, the
              category table, and the per-category rollups.
            - Put every ⛔ and ⚠️ finding on a line the diff touches into
              `comments`, anchored to that line (`side` is `RIGHT` for added/
              context lines, `LEFT` for removed ones). The reviews API can only
              attach inline comments to lines in the diff — pre-existing or
              adjacent findings on untouched lines, and all ℹ️ / 💡 / ❓, stay in
              the body under their category.
            - If `event` is `APPROVE` and the API returns 422 because the token
              can't approve its own review, resubmit with `event` set to
              `COMMENT` and note in the body that you intended to approve.
            - If the POST fails because an inline comment targets a line outside
              the diff (a common 422), move that finding into the body and drop
              it from `comments`, then resubmit. A review must land — if you
              can't get the inline comments to take, POST with an empty
              `comments` array rather than posting nothing.

            This PR may already have earlier reviews from you. Before you review,
            read your prior review bodies (`gh api
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews
            --jq '.[] | select(.body | startswith("<!-- control-room:review -->")) | .body'`)
            and any replies on their threads. Those are your prior rounds.
            REVIEW.md's "Reviewing across rounds" section tells you how they
            change this review — which blocking items were already raised and
            whether the new commits addressed them (mark those ✅), which the
            author replied to without changing (mark those 💬), which non-blocking
            observations you've already made, and when the right move is to
            approve and land the PR rather than keep hunting.

            Read these files first and follow them exactly:

            - `.claude-review/REVIEW.md` — how to review. The categories, the
              severity labels, the verdicts, what to raise, what to leave alone.
            - `.claude-review/BASELINE.md` — the language-agnostic rules the
              change must hold to. Each rule is tagged with its category and
              default severity; a finding inherits that tag. Flag violations of
              its Rules section. Do not flag anything in its Preferences section
              or its linter section.
            - `.claude-review/EXAMPLE.md` — a filled-in review. Match its shape:
              the summary body format and how findings read.

            Then list `.claude-review/languages/` and read the file for each
            language this PR actually touches, if one exists. Those sharpen the
            baseline into the specific forms its rules take in that language.
            Skip the ones the PR doesn't touch, and don't invent rules for a
            language with no file — fall back to the baseline and the
            conventions visible in the surrounding code.

            Then read this repository's own CLAUDE.md files, if any — the root
            one, plus any in directories this PR touched. They add to the
            baseline, and they win where the two disagree. Say which file a rule
            came from when you flag it.

            ${{ inputs.verify_commands != '' && 'Dependencies are installed. Run these commands and report the real output:' || 'Dependencies are NOT installed in this sandbox. Do not claim you ran the typechecker or linter — say plainly that you reviewed by reading.' }}
            ${{ inputs.verify_commands }}

      # Belt and suspenders. Claude retries its own POST (dropping bad inline
      # comments, downgrading APPROVE to COMMENT), but if it still didn't land a
      # review — a malformed payload, an off-diff comment it couldn't place, or
      # it died mid-run — re-post the summary it already wrote, stripped of the
      # inline comments that are the usual cause of a 422. Better a summary-only
      # review than none. Only fires when no review landed and Claude left its
      # payload behind; a workflow-validation skip leaves no payload and falls
      # through to the next step.
      - name: Fall back to a summary-only review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.started.outputs.at }}
          REVIEW_MARKER: '<!-- control-room:review -->'
        run: |
          set -euo pipefail

          posted=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.body | startswith(\"$REVIEW_MARKER\")) | select(.submitted_at >= \"$SINCE\")] | length")
          if [ "$posted" -gt 0 ]; then
            echo "Review already landed; no fallback needed."
            exit 0
          fi

          payload="$RUNNER_TEMP/review.json"
          if [ ! -f "$payload" ]; then
            echo "No saved payload; nothing to fall back to."
            exit 0
          fi

          # Strip the inline comments (the usual 422 cause) and post the summary.
          summary="$RUNNER_TEMP/review-summary.json"
          jq 'del(.comments)' "$payload" > "$summary"

          if gh api "repos/$REPO/pulls/$PR/reviews" --input "$summary"; then
            echo "Posted summary-only review."
            exit 0
          fi

          # Last resort: the event itself was rejected (e.g. APPROVE on a token
          # that can't approve). Downgrade to a plain COMMENT and try once more.
          echo "Summary review rejected; retrying as COMMENT."
          jq '.event = "COMMENT"' "$summary" > "$summary.comment"
          gh api "repos/$REPO/pulls/$PR/reviews" --input "$summary.comment"

      # The action exits 0 in several silent cases — most commonly workflow
      # validation ("the workflow file must have identical content to the
      # version on the default branch"), which fires on any PR that edits the
      # review workflow. A green check with no comment is indistinguishable
      # from a clean review, which is the exact failure this whole setup
      # exists to prevent. So say something, every time.
      - name: Say something if no review was posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SINCE: ${{ steps.started.outputs.at }}
          BASE: ${{ github.event.pull_request.base.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: '<!-- control-room:no-review -->'
          REVIEW_MARKER: '<!-- control-room:review -->'
        run: |
          set -euo pipefail

          # The review is now submitted via the reviews endpoint, not as an
          # issue comment. A review counts as posted if it carries the review
          # marker and landed after this run started.
          posted=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq "[.[] | select(.body | startswith(\"$REVIEW_MARKER\")) | select(.submitted_at >= \"$SINCE\")] | length")
          if [ "$posted" -gt 0 ]; then
            echo "Review posted; nothing to do."
            exit 0
          fi

          # Don't repeat ourselves on every push to the same PR.
          if gh api "repos/$REPO/issues/$PR/comments" --paginate \
               --jq '.[].body' | grep -qF "$MARKER"; then
            echo "Already explained on this PR; not commenting again."
            exit 0
          fi

          if ! git diff --quiet "origin/$BASE" HEAD -- .github/workflows/; then
            reason="This PR changes a file under \`.github/workflows/\`. The action requires the
          workflow file to be byte-identical to the copy on \`$BASE\`, so it skips
          and exits 0 — which is why the check is green. **This PR has not been
          reviewed.** It will work normally once merged."
          else
            reason="The review step finished without leaving a comment, and this PR doesn't
          touch \`.github/workflows/\`, so workflow validation isn't the cause.
          Worth checking the run log."
          fi

          gh pr comment "$PR" --repo "$REPO" --body "$MARKER
          ### Code review skipped

          $reason

          [Run log]($RUN_URL)"
